<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Loja · Controle de Promotores</title>
  <link rel="stylesheet" href="/css/estilo.css">
</head>
<body>
  <div class="estrutura">
    <nav class="menu" id="menu" aria-label="Menu principal"></nav>
    <main class="conteudo">
      <p><a href="/faturamento">← Voltar para Faturamento</a></p>
      <div class="topo">
        <div><h1 id="nome">Loja</h1><p class="subtitulo" id="sub"></p></div>
        <div class="filtros">
          <div class="campo"><label for="periodo-de">De</label><select id="periodo-de"></select></div>
          <div class="campo"><label for="periodo-ate">Até</label><select id="periodo-ate"></select></div>
        </div>
      </div>
      <div id="aviso" class="aviso" hidden></div>
      <div class="cards" id="cards"></div>
      <div class="painel">
        <h2>Faturamento mês a mês</h2>
        <div class="rolagem">
          <table>
            <thead><tr><th>Mês</th><th>Empresa</th><th class="num">Faturamento</th><th class="num">Custo promotores</th><th class="num">% custo</th><th>Situação</th></tr></thead>
            <tbody id="linhas"></tbody>
          </table>
        </div>
        <div class="paginacao" id="paginacao" hidden></div>
      </div>
      <div class="painel">
        <h2>Promotores que atendem esta loja</h2>
        <div class="rolagem">
          <table>
            <thead><tr><th>Promotor</th><th>Dias de visita</th><th class="num">Visitas</th><th class="num">Custo</th><th class="num">Faturamento nos meses atendidos</th><th class="num">% custo</th><th>Situação</th></tr></thead>
            <tbody id="promotores"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
  <script src="/js/comum.js"></script>
  <script src="/js/loja.js"></script>
</body>
</html>
