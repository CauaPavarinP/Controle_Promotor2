<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lojas por UF · Controle de Promotores</title>
  <link rel="stylesheet" href="/css/estilo.css">
</head>
<body>
  <div class="estrutura">
    <nav class="menu" id="menu" aria-label="Menu principal"></nav>
    <main class="conteudo">
      <div class="topo">
        <div><h1>Lojas por UF</h1><p class="subtitulo">Lojas atendidas, uma linha por promotor e loja, com o valor informado em cada mês.</p></div>
        <div class="acoes">
          <button type="button" id="imprimir" class="secundario">Imprimir</button>
          <button type="button" id="exportar" class="secundario">Exportar Excel</button>
        </div>
      </div>
      <div class="painel">
        <div class="filtros" id="filtros-comuns"></div>
        <div class="etiquetas" id="etiquetas"></div>
      </div>
      <div id="avisos"></div>
      <div id="aviso" class="aviso" hidden></div>
      <div class="painel">
        <div class="grupo-botoes nao-imprimir" id="botoes-uf" role="group" aria-label="Escolher UF"></div>
        <label class="caixa-opcao nao-imprimir"><input type="checkbox" id="ocultar-sem-custo">Ocultar agências sem nenhum custo informado</label>
        <p class="ajuda" id="resumo-tabela"></p>
        <div class="rolagem">
          <table class="tabela-larga" id="tabela">
            <thead id="cabecalho"></thead>
            <tbody id="linhas"></tbody>
            <tfoot id="totais"></tfoot>
          </table>
        </div>
        <div class="paginacao" id="paginacao" hidden></div>
      </div>
    </main>
  </div>
  <script src="/js/comum.js"></script>
  <script src="/js/lojas-uf.js"></script>
</body>
</html>
