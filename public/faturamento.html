<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Faturamento · Controle de Promotores</title>
  <link rel="stylesheet" href="/css/estilo.css">
</head>
<body>
  <div class="estrutura">
    <nav class="menu" id="menu" aria-label="Menu principal"></nav>
    <main class="conteudo">
      <div class="topo">
        <div><h1>Faturamento das lojas</h1><p class="subtitulo">Quanto cada loja faturou e quanto custaram os promotores que a atendem. Clique em uma loja para ver os detalhes.</p></div>
        <div class="acoes">
          <a class="botao secundario" href="/importar">Importar faturamento</a>
          <button type="button" id="exportar" class="secundario">Exportar Excel</button>
        </div>
      </div>
      <div class="painel">
        <div class="filtros" id="filtros-comuns"></div>
        <div class="filtros linha-extra">
          <div class="campo largo"><label for="busca">Buscar loja, cidade ou CNPJ</label><input id="busca" type="search" autocomplete="off"></div>
          <div class="campo"><label for="empresa">Empresa (ERP)</label><select id="empresa"><option value="">Todas</option></select></div>
          <div class="campo"><label for="situacao">Situação</label>
            <select id="situacao">
              <option value="">Todas</option><option value="dentro">Dentro da meta</option><option value="fora">Fora da meta</option>
              <option value="sem_faturamento">Sem faturamento</option><option value="falta_faturamento">Falta o faturamento</option>
              <option value="custo_nao_informado">Custo não informado</option><option value="sem_cnpj">Sem CNPJ</option>
              <option value="sem_atendimento_no_mes">Comprou sem atendimento</option><option value="sem_promotor">Sem promotor</option>
            </select>
          </div>
        </div>
        <div class="etiquetas" id="etiquetas"></div>
      </div>
      <div id="avisos"></div>
      <div id="aviso" class="aviso" hidden></div>
      <div class="painel">
        <div class="rolagem">
          <table>
            <thead><tr><th>Loja / cliente do ERP</th><th>Cidade</th><th class="num">Faturamento</th><th class="num">Visitas</th><th class="num">Custo promotores</th><th class="num">% custo</th><th>Situação</th></tr></thead>
            <tbody id="linhas"></tbody>
            <tfoot id="totais"></tfoot>
          </table>
        </div>
        <div class="paginacao" id="paginacao" hidden></div>
      </div>
    </main>
  </div>
  <script src="/js/comum.js"></script>
  <script src="/js/faturamento.js"></script>
</body>
</html>
