<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar · Controle de Promotores</title>
  <link rel="stylesheet" href="/css/estilo.css">
</head>
<body>
  <main class="login">
    <form class="painel" id="form">
      <h1>Controle de Promotores</h1>
      <p class="subtitulo">101 do Brasil</p>
      <div id="aviso" class="aviso" hidden></div>
      <div class="campo"><label for="login">Login</label><input id="login" required autocomplete="username" autocapitalize="none" autofocus></div>
      <div class="campo"><label for="senha">Senha</label><input id="senha" type="password" required autocomplete="current-password"></div>
      <button type="submit">Entrar</button>
    </form>
  </main>
  <script src="/js/comum.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
