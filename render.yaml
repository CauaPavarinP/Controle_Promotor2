# Blueprint do Render: descreve o serviço web (o servidor Node).
#
# O BANCO NÃO É CRIADO AQUI: o banco do sistema é o PostgreSQL do Neon (neon.tech), e não um banco do Render.
# Por isso não há bloco "databases" e o DATABASE_URL não vem de "fromDatabase": ele é preenchido à mão no painel
# do Render (serviço -> Environment), com o endereço de conexão copiado do painel do Neon.
#
# "sync: false" quer dizer: o Blueprint só declara que a variável existe; o VALOR fica no painel e nunca vai para
# o GitHub. Vale para o DATABASE_URL (tem a senha do banco) e para os dados do primeiro usuário (ADMIN_*).
# ATENÇÃO: o serviço que está no ar ("controle-promotor2") foi criado pelo painel, não por este arquivo. Este
# Blueprint serve de documentação e para recriar o serviço do zero. Não aplique sem conferir antes.
services:
  - type: web
    name: controle-promotor2
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /login
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false # endereço do banco no Neon, preenchido no painel do Render
      - key: SESSION_SECRET
        generateValue: true
      - key: META_PERCENTUAL
        value: 3
      - key: ADMIN_LOGIN
        sync: false
      - key: ADMIN_NOME
        sync: false
      - key: ADMIN_SENHA
        sync: false
