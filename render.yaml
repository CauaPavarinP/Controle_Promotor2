# Blueprint do Render: cria o serviço web e o banco PostgreSQL juntos.
# Os valores secretos (ADMIN_SENHA) são preenchidos no painel do Render.
databases:
  - name: controle-promotor-db
    plan: free
    databaseName: promotor
    user: promotor

services:
  - type: web
    name: controle-promotor
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /login
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: controle-promotor-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: META_PERCENTUAL
        value: 3
      - key: ADMIN_LOGIN
        sync: false
      - key: ADMIN_NOME
        sync: false
      - key: ADMIN_SENHA
        sync: false
